name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.count.outputs.passed }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=results.xml

      - name: Count passed tests
        id: count
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('results.xml').getroot(); s=r if r.tag=='testsuite' else r[0]; print('passed=' + str(int(s.get('tests')) - int(s.get('failures')) - int(s.get('errors')) - int(s.get('skipped', 0))))" >> "$GITHUB_OUTPUT"

      - name: Send test report
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python send_report.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Add deploy status to the page
        env:
          PASSED: ${{ needs.test.outputs.passed }}
          RUN: ${{ github.run_number }}
        run: |
          TIME=$(TZ=Asia/Karachi date '+%d %b %Y, %H:%M')
          sed -i "s/__PASSED__/$PASSED/; s/__COMMIT__/${GITHUB_SHA::7}/; s/__RUN__/$RUN/; s/__TIME__/$TIME/" docs/index.html

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the demo
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
